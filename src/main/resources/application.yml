spring:
  application:
    name: park-sense
  datasource:
    url: jdbc:h2:mem:parksensedb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

gemini:
  api-key: ${GEMINI_API_KEY:brak_klucza}

